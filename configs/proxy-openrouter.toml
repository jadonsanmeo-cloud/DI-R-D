# Model provider configuration. Runtime secrets are resolved from the environment.
[models]
[[models.llms]]
name = "${env:LLM_MODEL_NAME}"
provider = "proxy/openrouter"
api_base = "https://openrouter.ai/api/v1"
api_key = "${env:OPENROUTER_API_KEY}"

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME}"
provider = "proxy/openrouter"
api_url = "https://openrouter.ai/api/v1/embeddings"
api_key = "${env:OPENROUTER_API_KEY}"
