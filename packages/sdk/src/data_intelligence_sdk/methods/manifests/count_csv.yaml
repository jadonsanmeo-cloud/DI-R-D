name: count_csv
version: "1.0.0"
entrypoint: data_intelligence_sdk.methods.csv:count_csv
description: Count CSV rows, optionally with a simple predicate.
capability_names:
  - count_csv
  - aggregate_data
  - count_tabular_rows
  - aggregate_count
  - answer_csv_question
tags:
  - csv
  - tabular
  - aggregation
  - count
trust_level: builtin
status: stable
priority: 80
use_when:
  - You need row counts or record totals.
  - The user asks how many records match a condition.
do_not_use_when:
  - You need to sum or average numeric values instead of counting rows.
metadata:
  category: csv
  deterministic: true
  side_effects: false
