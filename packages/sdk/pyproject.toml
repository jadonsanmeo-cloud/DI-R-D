[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-intelligence-sdk"
version = "0.1.0"
description = "Reusable data intelligence orchestration SDK."
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "PyYAML>=6.0.3",
    "langgraph>=1.2.7",
    "psycopg[binary]>=3.3.4",
    "langsmith>=0.9.5",
    "mcp[cli]>=1.28.1",
    "deepagents>=0.6.12",
    "pypdf>=6.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data_intelligence_sdk.methods" = ["manifests/*.yaml", "manifests/*.yml"]
"data_intelligence_sdk.templates.pool" = ["*.json"]
