name: search_vector_chunks
version: "1.0.0"
entrypoint: data_intelligence_sdk.methods.vector:search_vector_chunks
description: Search document chunks in a Postgres pgvector source.
capability_names:
  - search_vector_chunks
  - search_vectordb
  - semantic_search
  - retrieve_documents
  - retrieve_relevant_chunks
  - answer_question
tags:
  - vector
  - retrieval
  - semantic_search
trust_level: builtin
status: stable
priority: 95
use_when:
  - You need relevant document chunks from a vector store.
  - The user asks what a document corpus is about or requests semantic retrieval.
do_not_use_when:
  - You are querying tabular CSV data.
metadata:
  category: vector
  deterministic: true
  side_effects: false
