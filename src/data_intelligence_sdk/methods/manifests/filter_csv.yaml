name: filter_csv
version: "1.0.0"
entrypoint: data_intelligence_sdk.methods.csv:filter_csv
description: Filter CSV rows with eq/ne/gt/gte/lt/lte/contains when a question asks for matching records.
capability_names:
  - filter_csv
  - filter_data
  - filter_tabular_data
  - answer_csv_question
tags:
  - csv
  - tabular
  - filtering
trust_level: builtin
status: stable
priority: 90
use_when:
  - You need a subset of rows that match a predicate.
  - The user asks for rows matching a condition.
do_not_use_when:
  - You only need a total count or sum without row-level filtering.
metadata:
  category: csv
  deterministic: true
  side_effects: false
