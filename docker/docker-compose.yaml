name: data-intelligence

services:
  api:
    build:
      context: ../..
      dockerfile: Data-Intelligence-SDK/docker/Dockerfile
    image: data-intelligence-api:local
    init: true
    ports:
      - "${API_PORT:-8036}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_CORPUS_ROOT: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER:-data_intelligence}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-data_intelligence}
      MODEL_CONFIG_PATH: /app/configs/proxy-openrouter.toml
      PYTHONPATH: /workspace/Data-Intelligence-SDK/packages/api/src:/workspace/Data-Intelligence-SDK/packages/sdk/src
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../packages/api/src:/workspace/Data-Intelligence-SDK/packages/api/src:ro
      - ../packages/sdk/src:/workspace/Data-Intelligence-SDK/packages/sdk/src:ro
      - ../configs/proxy-openrouter.toml:/app/configs/proxy-openrouter.toml:ro
      - api_data:/app/data
      - api_state:/app/.data
      - ../artifacts:/app/artifacts
    command:
      - uvicorn
      - data_intelligence_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /workspace/Data-Intelligence-SDK/packages/api/src
      - --reload-dir
      - /workspace/Data-Intelligence-SDK/packages/sdk/src
    stop_grace_period: 30s
    mem_limit: 256m

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-data_intelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-data_intelligence} -d ${POSTGRES_DB:-data_intelligence}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m

volumes:
  api_data:
  api_state:
  postgres_data:
