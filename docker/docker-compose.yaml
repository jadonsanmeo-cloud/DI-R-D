name: data-intelligence

services:
  api:
    build:
      context: ../..
      dockerfile: Data-Intelligence-SDK/docker/Dockerfile
    image: data-intelligence-api:local
    init: true
    # The bind-mounted artifacts directory is owned by the host developer.
    # Add its group so the non-root app user can persist per-run artifacts.
    group_add:
      - "${ARTIFACTS_GID:-1000}"
    ports:
      - "${API_PORT:-8036}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_CORPUS_ROOT: /app/data
      RUNTIME_SERVICE_TOKEN: ${RUNTIME_SERVICE_TOKEN:?Set RUNTIME_SERVICE_TOKEN}
      TOOL_SUBSCRIPTIONS_API_URL: ${TOOL_SUBSCRIPTIONS_API_URL:-http://host.docker.internal:8007/authz-service/api/v1/authz/me/tool-subscriptions}
      GEN_REPORT_API_URL: ${GEN_REPORT_API_URL:-http://host.docker.internal:8011}
      MODEL_CONFIG_PATH: /app/configs/proxy-openrouter.toml
      PYTHONPATH: /workspace/Data-Intelligence-SDK/packages/api/src:/workspace/Data-Intelligence-SDK/packages/sdk/src
      QUERYAI_REASON_ENDPOINT: ${QUERYAI_REASON_ENDPOINT:-http://host.docker.internal:7205/query}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_SERVICE_URL: ${MEMORY_SERVICE_URL:-http://host.docker.internal:8005}
      MEMORY_TENANT_ID: ${MEMORY_TENANT_ID:-test-org}
      MEMORY_DEFAULT_USER_ID: ${MEMORY_DEFAULT_USER_ID:-local-dev-user}
      MEMORY_SEARCH_LIMIT: ${MEMORY_SEARCH_LIMIT:-20}
      MEMORY_TIMEOUT_SECONDS: ${MEMORY_TIMEOUT_SECONDS:-2}
      MEMORY_SERVICE_TOKEN: ${MEMORY_SERVICE_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../packages/api/src:/workspace/Data-Intelligence-SDK/packages/api/src:ro
      - ../packages/sdk/src:/workspace/Data-Intelligence-SDK/packages/sdk/src:ro
      - ../configs/proxy-openrouter.toml:/app/configs/proxy-openrouter.toml:ro
      - api_data:/app/data
      - ../artifacts:/app/artifacts
    command:
      - uvicorn
      - data_intelligence_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /workspace/Data-Intelligence-SDK/packages/api/src
      - --reload-dir
      - /workspace/Data-Intelligence-SDK/packages/sdk/src
    stop_grace_period: 30s
    mem_limit: 256m
    networks:
      - default
      - axiom-k8s

volumes:
  api_data:

networks:
  axiom-k8s:
    external: true
    name: ${AXIOM_DOCKER_NETWORK:-axiom-k8s}
